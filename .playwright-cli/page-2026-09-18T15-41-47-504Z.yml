                - heading "Not every conversation leaves your charity stronger. Ours will." [level=3] [ref=e141]
              - paragraph [ref=e144]: The best fundraisers understand that this work is about far more than targets. It is about reading people, earning trust quickly, representing a cause properly, and knowing how to turn a conversation into something meaningful. We offer progression and serious rewards.
