    - generic [ref=e90]:
      - generic [ref=e92]:
        - generic [ref=e93]: STEP INSIDE OUR STORY
        - heading "Small moments that create meaningful change" [level=2] [ref=e97]
      - generic [ref=e99]:
        - paragraph [ref=e100]: On a crowded high street, most moments pass unnoticed. People move quickly, distracted by where they need to be next. And yet, every day, someone pauses long enough to listen to a story they did not expect to hear.
        - paragraph [ref=e101]: Someone who may never have considered supporting a cause before chooses to get involved, giving a charity the opportunity to build a lasting relationship with a new supporter. While each conversation may seem like a small moment, together they make a meaningful difference to the organisations and communities those charities serve.
        - paragraph [ref=e102]: We exist to create those moments, helping charities build real human connection in a world increasingly designed to ignore it.
      - link "Step inside" [ref=e104] [cursor=pointer]:
        - /url: "#"
